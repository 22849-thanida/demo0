<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติส่วนตัว - ด.ญ.ธนิดา ปันม้า</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
        }

        body {
            /* พื้นหลังไล่สีโทนเขียวอ่อน-ขาว */
            background: linear-gradient(135deg, #e0f2f1 0%, #a5d6a7 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px; /* เพิ่ม padding บน-ล่าง ให้รองรับการ์ดที่ยาวขึ้น */
        }

        .profile-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 420px; /* ขยายความกว้างเล็กน้อยเพื่อให้ดูสมดุล */
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .profile-card:hover {
            transform: translateY(-5px);
        }

        .card-header {
            background-color: #2e7d32; /* สีเขียวเข้ม */
            color: white;
            padding: 40px 20px 60px;
            position: relative;
        }

        .card-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .card-header p {
            font-size: 1rem;
            opacity: 0.9;
        }

        /* รูปโปรไฟล์จำลอง (ใช้วงกลมสีเขียวอ่อนและไอคอน) */
        .profile-img {
            width: 100px;
            height: 100px;
            background-color: #ffffff;
            border: 4px solid #81c784;
            border-radius: 50%;
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            color: #2e7d32;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .card-body {
            padding: 70px 30px 40px;
        }

        .info-list {
            list-style: none;
            text-align: left;
        }

        .info-list li {
            margin-bottom: 15px; /* ปรับลดระยะขอบลงเล็กน้อยเพื่อให้การ์ดไม่ยาวเกินไป */
            font-size: 1.05rem;
            color: #333;
            display: flex;
            align-items: center;
            background: #f1f8e9; /* พื้นหลังสีเขียวอ่อนมากสำหรับแต่ละบรรทัด */
            padding: 14px;
            border-radius: 12px;
            transition: background 0.3s ease;
        }

        .info-list li:hover {
            background: #e8f5e9;
        }

        .info-icon {
            width: 40px;
            height: 40px;
            background-color: #4caf50; /* สีเขียว */
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 15px;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .info-label {
            font-weight: 500;
            color: #2e7d32;
            margin-right: 8px;
        }

    </style>
</head>
<body>

    <div class="profile-card">
        <div class="card-header">
            <h1>ด.ญ.ธนิดา ปันม้า</h1>
            <p>ประวัติส่วนตัว</p>
            <div class="profile-img">
                <i class="fa-solid fa-user-graduate"></i>
            </div>
        </div>
        
        <div class="card-body">
            <ul class="info-list">
                <li>
                    <div class="info-icon"><i class="fa-solid fa-face-smile"></i></div>
                    <div>
                        <span class="info-label">ชื่อเล่น:</span> แต๊กา
                    </div>
                </li>
                <li>
                    <div class="info-icon"><i class="fa-solid fa-cake-candles"></i></div>
                    <div>
                        <span class="info-label">วันเกิด:</span> 10 กุมภาพันธ์ 2555
                    </div>
                </li>
                <li>
                    <div class="info-icon"><i class="fa-solid fa-utensils"></i></div>
                    <div>
                        <span class="info-label">อาหารที่ชอบ:</span> ผัดผัก
                    </div>
                </li>
                <li>
                    <div class="info-icon"><i class="fa-solid fa-palette"></i></div>
                    <div>
                        <span class="info-label">สีที่ชอบ:</span> สีเขียว
                    </div>
                </li>
                <li>
                    <div class="info-icon"><i class="fa-solid fa-book-open"></i></div>
                    <div>
                        <span class="info-label">วิชาที่ชอบ:</span> วิทยาศาสตร์ และ คณิตศาสตร์
                    </div>
                </li>
                <li>
                    <div class="info-icon"><i class="fa-solid fa-user-group"></i></div>
                    <div>
                        <span class="info-label">เพื่อนสนิท:</span> ทุกคนในห้องม.3/2
                    </div>
                </li>
            </ul>
        </div>
    </div>

</body>
</html>
