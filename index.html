<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติส่วนตัว - เด็กหญิงธนิดา ปันม้า</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            /* เปลี่ยนโทนสีหลักเป็นสีเขียว */
            --primary-color: #16a34a; /* Green 600 */
            --primary-light: #dcfce7; /* Green 100 */
            --secondary-color: #22c55e; /* Green 500 */
            --text-main: #1e293b; /* Slate 800 */
            --text-muted: #64748b; /* Slate 500 */
            --bg-color: #f0fdf4; /* Green 50 */
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 210mm; /* A4 Width */
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(22, 163, 74, 0.15);
            overflow: hidden;
            position: relative;
        }

        .card-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 40px 30px;
            text-align: center;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center; /* จัดกลางรูปและข้อความในแนวตั้ง */
        }

        /* --- เพิ่ม CSS สำหรับรูปโปรไฟล์ --- */
        .profile-img {
            width: 130px; /* ขนาดรูปโปรไฟล์ (เท่ากันเพื่อให้เป็นวงกลม) */
            height: 130px; /* ขนาดรูปโปรไฟล์ (เท่ากันเพื่อให้เป็นวงกลม) */
            object-fit: cover; /* ทำให้รูปไม่เบี้ยวเมื่อ crop */
            border-radius: 50%; /* ทำให้เป็นวงกลม */
            border: 4px solid white; /* เส้นขอบสีขาว */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2); /* เงาใต้รูป */
            margin-bottom: 20px; /* ระยะห่างจากข้อความโรงเรียนด้านล่าง */
        }
        /* ------------------------------- */

        .school-badge {
            background-color: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        .name {
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .nickname {
            font-size: 1.2rem;
            font-weight: 300;
            opacity: 0.9;
        }

        .motto {
            margin-top: 20px;
            font-style: italic;
            font-size: 1.1rem;
            padding: 15px;
            background-color: rgba(255, 255, 255, 0.15);
            border-left: 4px solid #fff;
            border-radius: 4px;
            display: inline-block;
        }

        .card-body {
            padding: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            padding-bottom: 80px; /* เว้นที่ให้น้องหมา */
        }

        .section-title {
            color: var(--primary-color);
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 15px;
            padding-bottom: 5px;
            border-bottom: 2px solid var(--primary-light);
            display: flex;
            align-items: center;
  0 0       gap: 8px;
        }

        .info-list {
            list-style: none;
        }

        .info-list li {
            margin-bottom: 10px;
            display: flex;
            align-items: baseline;
        }

        .info-label {
            font-weight: 500;
            color: var(--text-muted);
            min-width: 100px;
            display: inline-block;
        }

        .info-value {
            font-weight: 400;
            color: var(--text-main);
        }

        /* Skills Pill/Tag Styling */
        .skills-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .skill-pill {
            background-color: var(--primary-light);
            color: var(--primary-color);
            padding: 6px 16px;
            border-radius: 9999px;
            font-size: 0.9rem;
            font-weight: 500;
            border: 1px solid rgba(22, 163, 74, 0.2);
        }

        /* Cute Dogs Animation */
        .dogs-playground {
            position: absolute;
            bottom: 20px;
            right: 30px;
            display: flex;
            gap: 15px;
            align-items: flex-end;
        }

        .dog {
            font-size: 2.5rem;
            animation: bounce 1s infinite alternate;
        }

        .dog-1 {
            animation-delay: 0s;
            transform: scaleX(-1); /* หันหน้าเข้าหากัน */
        }

        .dog-2 {
            animation-delay: 0.5s;
        }

        @keyframes bounce {
            0% { transform: translateY(0) scaleX(var(--flip, 1)); }
            100% { transform: translateY(-10px) scaleX(var(--flip, 1)); }
        }
        
        .dog-1 { --flip: -1; }
        .dog-2 { --flip: 1; }

        /* Print Media Query for A4 */
        @media print {
            body {
                background-color: white;
                padding: 0;
                display: block;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
